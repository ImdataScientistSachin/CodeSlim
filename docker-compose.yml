version: '3.8'

services:
  codeslim:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - ollama
    command: ["ui", "--host", "0.0.0.0", "--port", "8000", "--no-open-browser"]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
