[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeslim"
version = "0.1.0"
description = "AI Code Quality Audit & Optimization Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "radon>=6.0",
    "vulture>=2.7",
    "lizard>=1.18",
    "httpx>=0.27",
    "diskcache>=5.6",
    "structlog>=24.0",
    "libcst>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "openai>=1.0",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.0",
]

[project.scripts]
codeslim = "codeslim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeslim*"]

[tool.setuptools.package-data]
codeslim = ["ui/static/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: tests that make real LLM calls (slow)"]

[tool.ruff]
line-length = 120
exclude = ["tests/fixtures/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures/.*"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = ["radon.*", "vulture.*", "lizard.*", "structlog.*"]
ignore_missing_imports = true
