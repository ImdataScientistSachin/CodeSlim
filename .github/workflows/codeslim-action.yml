name: CodeSlim Action
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  codeslim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e .
      - run: codeslim analyze ./ --format github-pr --output codeslim_report.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
