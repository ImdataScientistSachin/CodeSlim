name: CodeSlim Agentic CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: AST Parity, LibCST & Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"


      - name: 🔍 Lint Codebase with Ruff
        run: |
          ruff check . --output-format=github

      - name: 🧪 Execute AST Mutation & Unit Tests (132 Tests)
        run: |
          pytest tests/ -v --cov=codeslim --cov-report=term-missing --cov-report=xml

      - name: 📊 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: codeslim-coverage-report
          path: coverage.xml

  cli-smoke-test:
    name: CodeSlim CLI End-to-End Smoke Test
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install CodeSlim CLI
        run: |
          pip install -e .

      - name: ⚡ Test CLI Help & Analysis Commands
        run: |
          codeslim --help
          python -m codeslim --help
